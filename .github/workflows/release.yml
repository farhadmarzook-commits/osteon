# Builds the plugin from the tagged source, attests the build, and attaches it to the release.
# Runs when a release is published; can also be run by hand for an existing tag.
name: Release build
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example 1.1.1)
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - run: gh release upload "$TAG" main.js styles.css manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
